<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <clipPath id="circle"><circle cx="400" cy="400" r="400"/></clipPath>
  </defs>
  <g clip-path="url(#circle)">
    <rect width="800" height="800" fill="#F2E6D0"/>
    <circle cx="400" cy="430" r="300" fill="#E8D7B8"/>

    <!-- hombros: hoodie gris sobre camiseta blanca -->
    <path d="M170 800 C170 660 260 600 400 600 C540 600 630 660 630 800 Z" fill="#9AA0A6" stroke="#2B2118" stroke-width="14" stroke-linejoin="round"/>
    <path d="M340 606 L400 690 L460 606 C440 598 420 596 400 596 C380 596 360 598 340 606 Z" fill="#FFFFFF" stroke="#2B2118" stroke-width="12" stroke-linejoin="round"/>

    <!-- cabeza: rectangular redondeada, lisa, sin nariz ni orejas ni pelo -->
    <rect x="215" y="185" width="370" height="420" rx="120" ry="120" fill="#F6DFC0" stroke="#2B2118" stroke-width="16"/>

    <!-- gorra azul marino cubriendo toda la parte superior -->
    <path d="M215 305 C215 200 290 140 400 140 C510 140 585 200 585 305 Z" fill="#1E3A5F" stroke="#2B2118" stroke-width="16" stroke-linejoin="round"/>
    <path d="M585 300 C650 300 690 318 700 344 C664 356 618 358 585 352 Z" fill="#1A3252" stroke="#2B2118" stroke-width="14" stroke-linejoin="round"/>
    <rect x="215" y="292" width="370" height="26" rx="13" fill="#16294A" stroke="#2B2118" stroke-width="10"/>

    <!-- cejas gruesas, muy por encima de los ojos, con hueco visible -->
    <rect x="272" y="370" width="98" height="26" rx="13" fill="#2B2118"/>
    <rect x="430" y="370" width="98" height="26" rx="13" fill="#2B2118"/>

    <!-- ojos: ovalos negros grandes, separados, sin iris ni brillo -->
    <ellipse cx="321" cy="452" rx="44" ry="54" fill="#151515"/>
    <ellipse cx="479" cy="452" rx="44" ry="54" fill="#151515"/>

    <!-- boca muy pequena, abajo en la cara -->
    <rect x="379" y="540" width="42" height="15" rx="7.5" fill="#2B2118"/>
  </g>
</svg>
