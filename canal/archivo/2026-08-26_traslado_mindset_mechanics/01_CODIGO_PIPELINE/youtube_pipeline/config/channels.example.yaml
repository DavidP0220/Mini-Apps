# Copia este archivo a config/channels.yaml y complétalo con tus canales.
# Cada canal tiene sus propias credenciales (oauth_token_path), completamente
# aisladas de las demás: si YouTube suspende un canal, los tokens y el
# historial de los otros canales no se ven afectados.

channels:
  - name: canal_finanzas
    niche: "finanzas personales, formato explicativo con datos concretos"
    language: es
    reference_channels: ["@TomTalksMoney2k"]   # slideshow + voz en off, ~20 min, 65.9k subs
    elevenlabs_voice_id: ""          # ID de voz en ElevenLabs para este canal
    oauth_token_path: "channels/canal_finanzas/token.json"
    output_dir: "channels/canal_finanzas/output"

  - name: canal_psicologia
    niche: "psicología/comportamiento, formato 'Every [tema] Explained'"
    language: es
    reference_channels: ["@EverythingProfessor"]  # fórmula de título repetible, 587k subs
    elevenlabs_voice_id: ""
    oauth_token_path: "channels/canal_psicologia/token.json"
    output_dir: "channels/canal_psicologia/output"
